<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" role="img" aria-labelledby="pizzaBoxTitle">
  <title id="pizzaBoxTitle">Ilustração vista de cima de uma caixa de pizza aberta, com a tampa personalizada com a marca Evolution ao lado</title>
  <defs>
    <linearGradient id="boxFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7CE9E"/>
      <stop offset="100%" stop-color="#CBA96F"/>
    </linearGradient>
    <linearGradient id="boxInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3E3C4"/>
      <stop offset="100%" stop-color="#E3C79A"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7A854"/>
      <stop offset="100%" stop-color="#C9863A"/>
    </linearGradient>
    <radialGradient id="cheese" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFD873"/>
      <stop offset="100%" stop-color="#F5B942"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- open lid, tucked behind/beside the box -->
  <g filter="url(#softShadow)">
    <rect x="270" y="70" width="200" height="200" rx="18" fill="url(#boxFace)" transform="rotate(8 370 170)"/>
    <rect x="290" y="90" width="160" height="160" rx="10" fill="none" stroke="#B99457" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" transform="rotate(8 370 170)"/>
    <g transform="rotate(8 370 170)">
      <rect x="330" y="150" width="100" height="30" rx="6" fill="#D80000"/>
      <text x="380" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff">EVOLUTION</text>
    </g>
  </g>

  <!-- box base, top-down, with pizza inside -->
  <g filter="url(#softShadow)">
    <rect x="60" y="150" width="260" height="260" rx="20" fill="url(#boxFace)"/>
    <rect x="80" y="170" width="220" height="220" rx="12" fill="url(#boxInner)"/>

    <circle cx="190" cy="280" r="102" fill="url(#crust)"/>
    <circle cx="190" cy="280" r="86" fill="url(#cheese)"/>

    <circle cx="158" cy="248" r="13" fill="#C63B2E"/>
    <circle cx="222" cy="240" r="13" fill="#C63B2E"/>
    <circle cx="240" cy="292" r="13" fill="#C63B2E"/>
    <circle cx="178" cy="318" r="13" fill="#C63B2E"/>
    <circle cx="140" cy="300" r="13" fill="#C63B2E"/>
    <circle cx="205" cy="272" r="13" fill="#C63B2E"/>

    <ellipse cx="170" cy="270" rx="8" ry="5" fill="#3C8C0F" transform="rotate(20 170 270)"/>
    <ellipse cx="228" cy="262" rx="8" ry="5" fill="#3C8C0F" transform="rotate(-15 228 262)"/>
    <ellipse cx="200" cy="308" rx="8" ry="5" fill="#3C8C0F" transform="rotate(40 200 308)"/>
    <ellipse cx="152" cy="296" rx="8" ry="5" fill="#3C8C0F" transform="rotate(-30 152 296)"/>
  </g>

  <ellipse cx="260" cy="470" rx="190" ry="18" fill="#000000" opacity="0.10"/>
</svg>
